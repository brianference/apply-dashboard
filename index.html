<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Applications</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="icon" href="01-light-32.png" type="image/png" media="(prefers-color-scheme: light)"/>
<link rel="icon" href="01-dark-32.png" type="image/png" media="(prefers-color-scheme: dark)"/>
<style>
  /* Steel Mist (palette-04) - design-refs/palettes/palettes.json */
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --text: #1a232b;
    --muted: #44525c;
    --border: #d0d7de;
    --primary: #2c5266;
    --primary-contrast: #ffffff;
    --success: #1b5e48;
    --success-bg: rgba(27, 94, 72, 0.12);
    --warn: #8a4b12;
    --warn-bg: rgba(138, 75, 18, 0.12);
    --primary-soft: rgba(44, 82, 102, 0.10);
    --row-hover: rgba(44, 82, 102, 0.055);
    --shadow: 0 1px 2px rgba(26,35,43,.06), 0 4px 12px rgba(26,35,43,.04);
    --radius: 10px;
    color-scheme: light;
  }
  /* Light is the default on purpose: the OS dark preference is NOT honoured
     automatically. Dark only applies when the owner toggles it. */
  :root[data-theme="dark"] {
    --bg: #131a20;
    --surface: #1c242b;
    --text: #e8eef2;
    --muted: #a3b2bc;
    --border: #33404a;
    --primary: #8fb4c8;
    --primary-contrast: #131a20;
    --success: #7ad7a8;
    --success-bg: rgba(122,215,168,.16);
    --warn: #e8b078;
    --warn-bg: rgba(232,176,120,.16);
    --primary-soft: rgba(143,180,200,.16);
    --row-hover: rgba(143,180,200,.08);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.2);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 "IBM Plex Sans", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 12px; }

  /* ---- masthead: big brand + big stats. Scrolls away; the toolbar sticks. ---- */
  .masthead { background: var(--surface); border-bottom: 1px solid var(--border); }
  .bar { display: flex; align-items: center; gap: 18px; padding: 18px 0 6px; }
  .brand { display: flex; align-items: center; gap: 16px; flex: 0 0 auto; }
  .brand img { width: 104px; height: 104px; display: block; border-radius: 18px; }
  h1 { margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -.025em; white-space: nowrap; }
  .spacer { flex: 1 1 auto; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 0 16px; }
  .stat {
    flex: 1 1 128px; min-width: 118px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px 11px;
  }
  .stat b {
    display: block; font: 700 44px/1 "IBM Plex Sans", system-ui, sans-serif;
    letter-spacing: -.03em; color: var(--text); font-variant-numeric: tabular-nums;
  }
  .stat span {
    display: block; margin-top: 6px; color: var(--muted);
    font: 600 12px/1 "IBM Plex Mono", ui-monospace, monospace;
    text-transform: uppercase; letter-spacing: .06em;
  }
  .stat.good b { color: var(--success); }
  @media (max-width: 700px) {
    .brand img { width: 72px; height: 72px; border-radius: 14px; }
    h1 { font-size: 30px; }
    .bar { padding: 14px 0 4px; gap: 12px; }
    .stat { flex: 1 1 44%; min-width: 0; padding: 10px 12px 9px; }
    .stat b { font-size: 34px; }
  }

  /* ---- toolbar + column head are what actually stick ---- */
  .sticky {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .iconbtn {
    appearance: none; background: transparent; border: 1px solid var(--border);
    border-radius: 8px; width: 30px; height: 30px; cursor: pointer; color: var(--muted);
    font-size: 14px; line-height: 1; display: grid; place-items: center; flex: 0 0 auto;
  }
  .iconbtn:hover { color: var(--text); border-color: var(--primary); }

  .toolbar { display: flex; gap: 6px; align-items: center; padding: 0 0 8px; flex-wrap: wrap; }
  .search {
    flex: 1 1 200px; min-width: 150px; max-width: 380px; height: 30px;
    padding: 0 10px; border: 1px solid var(--border); border-radius: 8px;
    font: 13px inherit; background: var(--bg); color: var(--text);
  }
  .search:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; flex: 1 1 100%; }
  @media (min-width: 861px) { .chips { flex: 0 1 auto; } }
  .chip {
    appearance: none; background: transparent; border: 1px solid var(--border);
    border-radius: 7px; padding: 0 9px; height: 30px; font: 500 12.5px/1 inherit;
    color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .chip:hover { color: var(--text); }
  .chip[aria-pressed="true"] {
    border-color: var(--primary); color: var(--primary);
    background: var(--primary-soft); font-weight: 600;
  }
  .sortsel {
    height: 30px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); color: var(--text); font: 500 12.5px inherit; padding: 0 6px; cursor: pointer;
  }
  .err { color: #8b2e1a; margin: 0 0 8px; font-size: 12.5px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .err { color: #e8a070; } }
  :root[data-theme="dark"] .err { color: #e8a070; }

  /* ---- sections ---- */
  main { padding-bottom: 56px; }
  section { margin-top: 12px; }
  .sechead {
    display: flex; align-items: center; gap: 8px; width: 100%;
    appearance: none; background: transparent; border: 0; cursor: pointer;
    padding: 4px 2px; color: var(--text); font: 600 13px/1 inherit;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .sechead .n {
    font: 600 11px/1 "IBM Plex Mono", monospace; color: var(--muted);
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 20px; padding: 3px 7px;
  }
  .sechead .caret { color: var(--muted); font-size: 10px; transition: transform .12s; }
  .sechead[aria-expanded="false"] .caret { transform: rotate(-90deg); }
  .sechead .hint { font: 400 11px/1 inherit; color: var(--muted); text-transform: none; letter-spacing: 0; }

  .rows {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    margin-top: 6px; overflow: hidden;
  }
  .rows[hidden] { display: none; }

  /* ---- per-column filter header ---- */
  .colhead {
    display: grid; align-items: center; gap: 10px;
    grid-template-columns: 42px minmax(0,1fr) 96px minmax(0,132px) 78px minmax(82px,auto);
    padding: 6px 10px; background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  /* Excel-style: each header is a button that opens a checkbox list of the
     distinct values in that column. Not a second search box. */
  .colbtn {
    appearance: none; background: transparent; border: 1px solid transparent;
    border-radius: 6px; cursor: pointer; width: 100%; min-width: 0;
    display: flex; align-items: center; gap: 5px; padding: 4px 6px;
    font: 600 10.5px/1 "IBM Plex Mono", monospace; letter-spacing: .05em;
    color: var(--muted); text-transform: uppercase; text-align: left;
  }
  .colbtn:hover { color: var(--text); border-color: var(--border); background: var(--surface); }
  .colbtn .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .colbtn .fun { margin-left: auto; opacity: .5; flex: 0 0 auto; }
  .colbtn[data-on="true"] { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
  .colbtn[data-on="true"] .fun { opacity: 1; }
  .colbtn.right { justify-content: flex-end; }
  .colbtn.right .fun { margin-left: 4px; }

  .fmenu {
    position: absolute; z-index: 40; min-width: 232px; max-width: 320px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.22);
    padding: 8px; display: flex; flex-direction: column; gap: 6px;
  }
  .fmenu input.fsearch {
    height: 28px; padding: 0 8px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--bg); color: var(--text); font: 13px inherit;
  }
  .fmenu .flist {
    max-height: 268px; overflow-y: auto; display: flex; flex-direction: column;
    border: 1px solid var(--border); border-radius: 6px; padding: 4px;
  }
  .fmenu label {
    display: flex; align-items: center; gap: 7px; padding: 4px 5px;
    font: 13px/1.25 inherit; cursor: pointer; border-radius: 5px; min-width: 0;
  }
  .fmenu label:hover { background: var(--row-hover); }
  .fmenu label span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; }
  .fmenu label span.c { color: var(--muted); font: 500 11px "IBM Plex Mono", monospace; flex: 0 0 auto; }
  .fmenu input[type=checkbox] { accent-color: var(--primary); width: 14px; height: 14px; flex: 0 0 auto; }
  .fmenu .fall { border-bottom: 1px solid var(--border); margin-bottom: 3px; padding-bottom: 6px; font-weight: 600; }
  .fmenu .frow { display: flex; gap: 6px; }
  .fmenu button {
    flex: 1 1 auto; appearance: none; cursor: pointer; height: 28px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font: 600 12px/1 inherit;
  }
  .fmenu button.pri { background: var(--primary); color: var(--primary-contrast); border-color: var(--primary); }
  .fmenu button:hover { filter: brightness(1.06); }
  @media (max-width: 860px) { .colhead { display: none; } }

  /* ---- the compact row ---- */
  .row {
    display: grid; align-items: center; gap: 10px;
    /* the action cell must be allowed to grow: the "Sent? Yes No" confirm is
       wider than an Apply button, and a fixed 82px made it overlap the location */
    grid-template-columns: 42px minmax(0,1fr) 96px minmax(0,132px) 78px minmax(82px,auto);
    padding: 0 10px; height: 40px;
    border-top: 1px solid var(--border);
    font-size: 13px;
  }
  /* desktop: .meta dissolves so its two children become real grid columns */
  .meta { display: contents; }
  .conly { display: none; }
  .row:first-child { border-top: 0; }
  .row:hover { background: var(--row-hover); }
  .pct {
    font: 600 12px/1 "IBM Plex Mono", monospace; text-align: right;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .pct.hi { color: var(--success); }
  .main { min-width: 0; display: flex; align-items: baseline; gap: 8px; }
  .ttl {
    font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--text); min-width: 0;
  }
  .co { color: var(--muted); font-size: 12.5px; white-space: nowrap; flex: 0 0 auto; max-width: 34%; overflow: hidden; text-overflow: ellipsis; }
  .who { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ats {
    font: 600 10.5px/1 "IBM Plex Mono", monospace; letter-spacing: .03em;
    border-radius: 5px; padding: 4px 6px; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border: 1px solid transparent;
  }
  .ats.direct { color: var(--success); background: var(--success-bg); }

  /* Why a row could not be applied to automatically. Muted by default so it
     reads as context, and highlighted only for the one state that is a task
     for Brian rather than a defect for me. */
  .why {
    display: block;
    font: 500 10.5px/1.35 "IBM Plex Sans", system-ui, sans-serif;
    color: var(--muted); opacity: .85;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%;
  }
  .why.act-now { color: var(--warn, #b45309); opacity: 1; font-weight: 600; }
  .ats.wall   { color: var(--warn);    background: var(--warn-bg); }
  .ats.board  { color: var(--muted);   background: var(--bg); border-color: var(--border); }
  .act { display: flex; justify-content: flex-end; gap: 4px; }
  .apply {
    appearance: none; cursor: pointer; border: 1px solid var(--primary);
    background: var(--primary); color: var(--primary-contrast);
    border-radius: 7px; height: 26px; padding: 0 10px;
    font: 600 12px/1 inherit; white-space: nowrap;
  }
  .apply:hover { filter: brightness(1.08); }
  .apply.ghost { background: transparent; color: var(--primary); }
  .apply.manual,
  a.apply.manual {
    background: var(--warn-bg); border-color: transparent; color: var(--warn);
    text-decoration: none; display: inline-flex; align-items: center;
    height: 26px; padding: 0 10px; border-radius: 7px; font: 600 12px/26px inherit;
    white-space: nowrap;
  }
  .apply.manual:hover { text-decoration: underline; }

  /* Published pay. Blank when the posting does not state it -- an unknown
     salary is not a low one, and dashes would read as "no pay". */
  .pay {
    font: 600 11px/1 "IBM Plex Mono", monospace; color: var(--muted);
    text-align: right; white-space: nowrap;
  }
  .pay.over { color: var(--success); }
  @media (max-width: 860px) { .pay { display: none; } }

  /* "I already applied to this myself." Deliberately quiet -- it sits beside
     the main action on every unrecorded row, and it should never compete with
     it for attention or be hit by accident. */
  .did {
    appearance: none; cursor: pointer; margin-right: 6px;
    border: 1px solid var(--line, rgba(0,0,0,.14)); background: transparent;
    color: var(--muted); border-radius: 7px; height: 26px; width: 26px;
    font: 600 13px/1 inherit; padding: 0;
  }
  .did:hover { color: var(--success); border-color: var(--success); background: var(--success-bg); }
  .act { display: inline-flex; align-items: center; }
  .apply.done {
    background: var(--success-bg); border: 1px solid transparent; color: var(--success);
    cursor: default; font: 600 12px/26px inherit; padding: 0 10px; border-radius: 7px;
    display: inline-block; height: 26px;
  }
  .apply[disabled] { opacity: .55; cursor: not-allowed; }
  .confirm {
    display: inline-flex; align-items: center; gap: 4px;
    font: 600 11px/1 inherit; color: var(--muted);
    white-space: nowrap; flex: 0 0 auto;
    background: var(--surface); border-radius: 7px; padding-left: 4px;
  }
  .confirm button {
    appearance: none; cursor: pointer; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    border-radius: 6px; height: 24px; padding: 0 7px; font: 600 11.5px/1 inherit;
  }
  .confirm .yes { border-color: var(--success); color: var(--success); background: var(--success-bg); }
  .confirm .no:hover { border-color: var(--muted); }
  .empty { padding: 14px; color: var(--muted); font-size: 13px; }

  /* ---- mobile: two-line row, still compact ---- */
  @media (max-width: 860px) {
    .row {
      grid-template-columns: 40px minmax(0,1fr) auto;
      grid-template-areas: "pct main act" "pct meta act";
      height: auto; row-gap: 1px; padding: 7px 10px; column-gap: 8px;
    }
    .pct { grid-area: pct; align-self: center; }
    .main { grid-area: main; display: block; min-width: 0; }
    .ttl { display: block; max-width: 100%; }
    .co { display: none; }
    .meta {
      grid-area: meta; display: flex; gap: 6px; align-items: center;
      min-width: 0; font-size: 11.5px; color: var(--muted);
    }
    .conly { display: inline; }
    .act { grid-area: act; align-self: center; }
    .ats { padding: 2px 5px; font-size: 10px; flex: 0 0 auto; }
  }
  @media (max-width: 560px) {
    .tally { display: none; }
  }
  @media (max-width: 400px) {
    h1 { font-size: 15px; }
    .row { grid-template-columns: 34px minmax(0,1fr) auto; }
  }

  .legend {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    margin: 14px 2px 0; font-size: 11.5px; color: var(--muted);
  }
  .legend span.pair { display: inline-flex; align-items: center; gap: 5px; }
  .legend .ats { display: inline-block; }
  /* The unsynced-marks warning. Deliberately impossible to miss: the previous
     version of this warning was one line of grey text in a screen-reader-only
     status region, and jobs Brian had marked applied kept being applied to
     again for days without anything visible saying why. */
  .stale {
    margin: 10px 14px 0; padding: 10px 12px; border-radius: 8px;
    background: var(--warn-bg); border: 1px solid var(--warn);
    color: var(--warn); font: 500 13px/1.45 inherit;
  }
  .stale strong { font-weight: 700; }
  .stale button {
    margin-left: 8px; cursor: pointer; border: 1px solid var(--warn);
    background: transparent; color: var(--warn);
    border-radius: 6px; padding: 3px 10px; font: 600 12px/1 inherit;
  }
  .stale button:hover { background: var(--warn); color: var(--bg, #fff); }

  .toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 9px 15px;
    border-radius: 8px; font-size: 13px; font-weight: 500; z-index: 60;
    box-shadow: 0 6px 20px rgba(0,0,0,.28); max-width: 92vw;
  }
  .toast[hidden] { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <img src="mark-01.png" alt="" width="104" height="104"/>
        <h1>Applications</h1>
      </div>
      <div class="spacer"></div>
      <button type="button" class="iconbtn" id="token" title="Set the write token so Apply records to D1" aria-label="Set write token">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
          <circle cx="5.4" cy="10.6" r="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M7.6 8.4 13 3M11 5l1.6 1.6M9.6 6.4l1.6 1.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <button type="button" class="iconbtn" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
          <circle cx="8" cy="8" r="6.25" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <div class="stats" id="stats">
      <div class="stat"><b id="s-ft">&mdash;</b><span>Full-time</span></div>
      <div class="stat"><b id="s-pt">&mdash;</b><span>PT / C2C</span></div>
      <div class="stat good"><b id="s-sub">&mdash;</b><span>Applied</span></div>
      <div class="stat"><b id="s-dir">&mdash;</b><span>Direct form</span></div>
    </div>
  </div>
</header>
<div class="sticky">
  <div class="wrap">
    <div class="toolbar">
      <input class="search" id="q" type="search" placeholder="Search title, company, source" autocomplete="off" aria-label="Search jobs"/>
      <select class="sortsel" id="sort" aria-label="Sort order">
        <option value="applyable">Easiest to apply</option>
        <option value="match">Match %</option>
        <option value="company">Company</option>
        <option value="recent">Newest</option>
      </select>
      <div class="chips" role="group" aria-label="Filters">
        <button type="button" class="chip" data-kind="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-kind="ft" aria-pressed="false">Full-time</button>
        <button type="button" class="chip" data-kind="ptc2c" aria-pressed="false">PT/C2C</button>
        <button type="button" class="chip" data-kind="submitted" aria-pressed="false">Applied</button>
        <button type="button" class="chip" data-kind="manual" aria-pressed="false" title="Auto-apply could not finish these - they need you">Needs you <span id="nmanual"></span></button>
        <button type="button" class="chip" data-kind="under" aria-pressed="false" title="Also show postings that publish a salary below $180k">Under $180k</button>
        <button type="button" class="chip" data-kind="direct" aria-pressed="false" title="The company's own application form - no login wall, no bot check">Direct form <span id="ndirect"></span></button>
      </div>
    </div>
    <p class="err" id="err" hidden></p>
  </div>
</div>

<main class="wrap" id="main">
  <div class="empty" id="boot">Loading queue&#8230;</div>
</main>

<div class="wrap">
  <p class="legend" id="legend" hidden>
    <span class="pair"><span class="ats direct">GREENHOUSE</span> the company&#8217;s own form &#8212; apply straight through</span>
    <span class="pair"><span class="ats wall">INDEED</span> sign-in or bot check first</span>
    <span class="pair"><span class="ats board">NOMADS</span> job board &#8212; bounces you to the real form</span>
  </p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<span class="sr" id="live" role="status" aria-live="polite"></span>
<div id="stale" class="stale" role="alert" hidden></div>

<script>
(function () {
  "use strict";

  /* ---------- theme ---------- */
  var root = document.documentElement;
  try {
    var saved = localStorage.getItem("apply-theme");
    if (saved === "light" || saved === "dark") root.setAttribute("data-theme", saved);
  } catch (e) {}
  document.getElementById("theme").addEventListener("click", function () {
    /* light is the default no matter what the OS prefers, so an unset attribute
       means light. Inferring it from prefers-color-scheme made the first click a
       no-op on a dark-mode machine. */
    var cur = root.getAttribute("data-theme") === "dark" ? "dark" : "light";
    var next = cur === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("apply-theme", next); } catch (e) {}
  });

  /* ---------- applyability, derived from the posting host ----------

    var nManual = all.filter(function (j) { return j.blocked_reason && !isApplied(j); }).length;
    var mEl = document.getElementById("nmanual");
    if (mEl) mEl.textContent = nManual ? String(nManual) : "";

    document.getElementById("main").innerHTML = SECTIONS.map(function (sec) {
      var jobs = sortJobs(vis.filter(function (j) { return bucketOf(j) === sec.id; }));
      var open = !collapsed[sec.id];
      return '<section><button type="button" class="sechead" data-sec="' + sec.id + '" aria-expanded="' + open + '">'
        + '<span class="caret" aria-hidden="true">▼</span>' + sec.label
        + '<span class="n">' + jobs.length + "</span>"
        + (sec.hint ? '<span class="hint">' + sec.hint + "</span>" : "")
        + "</button>"
        + '<div class="rows" id="rows-' + sec.id + '"' + (open ? "" : " hidden") + ">"
        + colheadHtml(sec.id)
        + (jobs.length ? jobs.map(rowHtml).join("") : '<div class="empty">Nothing here.</div>')
        + "</div></section>";
    }).join("");
    document.getElementById("legend").hidden = false;
    wireColumnFilters();
  }

  /* ---------- the filter popup ---------- */
  var openMenu = null;

  function closeMenu() {
    if (openMenu) { openMenu.remove(); openMenu = null; }
    document.querySelectorAll('.colbtn[aria-expanded="true"]')
      .forEach(function (b) { b.setAttribute("aria-expanded", "false"); });
  }

  /**
   * Build and show the checkbox list for one column.
   * @param {HTMLElement} btn the header button that was clicked
   */
  function openFilterMenu(btn) {
    closeMenu();
    var colId = btn.getAttribute("data-col");
    var secId = btn.getAttribute("data-sec");
    var col = COLS.filter(function (c) { return c.id === colId; })[0];

    /* Offer the values present in THIS lane, ignoring this column's own filter
       so unticking everything does not leave an empty, unrecoverable list. */
    var rowsForLane = all.filter(function (j) {
      if (bucketOf(j) !== secId) return false;
      for (var i = 0; i < COLS.length; i++) {
        if (COLS[i].id === colId) continue;
        var sel = colSel[COLS[i].id];
        if (sel && !sel.has(COLS[i].value(j))) return false;
      }
      return true;
    });
    var values = distinct(colId, rowsForLane);
    var chosen = colSel[colId] ? new Set(colSel[colId]) : new Set(values.map(function (v) { return v.value; }));

    var menu = document.createElement("div");
    menu.className = "fmenu";
    menu.setAttribute("role", "dialog");
    menu.setAttribute("aria-label", "Filter by " + col.label);
    menu.innerHTML =
      '<input class="fsearch" type="search" placeholder="Search ' + esc(col.label.toLowerCase()) + '" aria-label="Search values"/>'
      + '<div class="flist"></div>'
      + '<div class="frow"><button type="button" class="clr">Clear filter</button>'
      + '<button type="button" class="pri ok">Apply</button></div>';
    document.body.appendChild(menu);

    var list = menu.querySelector(".flist");
    function paint(term) {
      var t = (term || "").toLowerCase();
      var shown = values.filter(function (v) { return !t || v.value.toLowerCase().indexOf(t) !== -1; });
      var allTicked = shown.length > 0 && shown.every(function (v) { return chosen.has(v.value); });
      list.innerHTML =
        '<label class="fall"><input type="checkbox" class="selall"' + (allTicked ? " checked" : "")
        + '/><span class="t">(Select all)</span><span class="c">' + shown.length + "</span></label>"
        + shown.map(function (v) {
          return '<label><input type="checkbox" value="' + esc(v.value) + '"'
            + (chosen.has(v.value) ? " checked" : "") + '/><span class="t">' + esc(v.value)
            + '</span><span class="c">' + v.count + "</span></label>";
        }).join("");
      list.querySelector(".selall").addEventListener("change", function () {
        shown.forEach(function (v) { this.checked ? chosen.add(v.value) : chosen.delete(v.value); }, this);
        paint(term);
      });
      list.querySelectorAll('input[type=checkbox]:not(.selall)').forEach(function (cb) {
        cb.addEventListener("change", function () {
          cb.checked ? chosen.add(cb.value) : chosen.delete(cb.value);
          var sa = list.querySelector(".selall");
          sa.checked = shown.every(function (v) { return chosen.has(v.value); });
        });
      });
    }
    paint("");

    menu.querySelector(".fsearch").addEventListener("input", function () { paint(this.value); });
    menu.querySelector(".clr").addEventListener("click", function () {
      colSel[colId] = null; closeMenu(); render();
    });
    menu.querySelector(".ok").addEventListener("click", function () {
      var everything = values.length > 0 && values.every(function (v) { return chosen.has(v.value); });
      colSel[colId] = everything ? null : chosen;   // all ticked === no filter
      closeMenu(); render();
    });

    var r = btn.getBoundingClientRect();
    menu.style.top = (r.bottom + window.scrollY + 4) + "px";
    var left = r.left + window.scrollX;
    menu.style.left = Math.min(left, window.scrollX + document.documentElement.clientWidth - menu.offsetWidth - 12) + "px";
    btn.setAttribute("aria-expanded", "true");
    openMenu = menu;
    menu.querySelector(".fsearch").focus();
  }

  /** Re-attach the header handlers after each innerHTML rebuild. */
  function wireColumnFilters() {
    document.querySelectorAll(".colbtn").forEach(function (b) {
      b.addEventListener("click", function (ev) { ev.stopPropagation(); openFilterMenu(b); });
    });
  }

  document.addEventListener("click", function (ev) {
    if (openMenu && !ev.target.closest(".fmenu") && !ev.target.closest(".colbtn")) closeMenu();
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeMenu(); });

  /* ---------- write token ----------
     Never baked into this file. The owner pastes it once; it lives only in
     this browser's localStorage and is sent as x-apply-token. */
  function writeToken() {
    try { return localStorage.getItem("apply-token") || ""; } catch (e) { return ""; }
  }
  function askToken() {
    var cur = writeToken();
    var next = window.prompt(
      "Write token for /api/apply.\n\nWithout it, Apply still opens the posting and remembers your click in this browser, but cannot record the status in D1.\n\nLeave blank to clear.",
      cur);
    if (next === null) return;
    next = next.trim();
    try {
      if (next) { localStorage.setItem("apply-token", next); toast("Write token saved in this browser."); }
      else { localStorage.removeItem("apply-token"); toast("Write token cleared — Apply will only record locally."); }
    } catch (e) { toast("Could not save the token: " + e.message); }
    markTokenState();
  }
  function markTokenState() {
    var b = document.getElementById("token");
    var on = !!writeToken();
    b.style.color = on ? "var(--success)" : "";
    b.title = on ? "Write token set — Apply records to D1" : "No write token — Apply records locally only";
  }
  document.getElementById("token").addEventListener("click", askToken);

  /* ---------- apply ---------- */
  function markApplied(job) {
    localApplied[keyOf(job)] = new Date().toISOString();
    try { localStorage.setItem("apply-applied", JSON.stringify(localApplied)); } catch (e) {}
    render();

    pushMark(job, true);
  }

  /* Send one "I applied to this" to D1, and make absolutely sure the caller
     knows if it did not land.
     ------------------------------------------------------------------------
     This is the repair for the worst bug this dashboard has had. Marking a job
     applied wrote to localStorage and then, with no write token in the browser,
     returned silently after setting one line of grey text: "Recorded in this
     browser only." D1 never learned, so the runner kept seeing the posting as
     queued and applied to it AGAIN. Brian marked jobs for days and watched them
     come back. A confirmation that only the confirming browser can see is not a
     confirmation.
     @param {object} job
     @param {boolean} interactive whether to ask for the token if it is missing
     @returns {Promise<boolean>} whether D1 accepted it */
  function pushMark(job, interactive) {
    /* NEVER prompt from a click. Brian marked Cribl applied and got a token
       dialog in his face for his trouble -- clicking "I applied to this" should
       make the row disappear, full stop. With no token the mark is kept locally
       and the banner says so; the banner's own button is the only place that
       ever asks, because the person clicked it. */
    var tok = writeToken();
    if (!tok) { markStale(); return Promise.resolve(false); }
    return fetch("/api/apply", {
      method: "POST",
      headers: { "content-type": "application/json", "x-apply-token": tok },
      body: JSON.stringify({ dedupe_key: job.dedupe_key, status: "submitted" })
    }).then(function (r) {
      if (r.status === 401) throw new Error("the write token was rejected");
      if (r.status === 503) throw new Error("writes are disabled on this deployment");
      if (!r.ok) throw new Error("HTTP " + r.status);
      /* Remember that THIS one is safely in D1, so reconcile stops retrying it. */
      pushed[keyOf(job)] = true;
      try { localStorage.setItem("apply-pushed", JSON.stringify(pushed)); } catch (e) {}
      markStale();
      return true;
    }).catch(function (e) {
      toast("NOT recorded — " + e.message + ". The runner may apply to this again.");
      markStale();
      return false;
    });
  }

  /* Anything marked applied in this browser that D1 still shows as queued.
     These are the jobs the runner will apply to a second time. */
  function unsynced() {
    return Object.keys(localApplied).filter(function (k) {
      if (pushed[k]) return false;
      var j = jobByKey(k);
      return j && !(j.status === "submitted" || laneOf(j) === "submitted");
    });
  }

  /* A loud, permanent banner. The old warning was one line of grey text in a
     status region, which is exactly why this went unnoticed for days. */
  function markStale() {
    var n = unsynced().length;
    var el = document.getElementById("stale");
    if (!el) return;
    if (!n) { el.hidden = true; el.textContent = ""; return; }
    el.hidden = false;
    el.innerHTML = "<strong>" + n + " job" + (n === 1 ? "" : "s") + " you marked applied "
      + "did not reach the database.</strong> The runner can still apply to "
      + (n === 1 ? "it" : "them") + " again. "
      + '<button type="button" id="fixstale">Record them now</button>';
  }

  /* Push every unsynced mark. Runs on load and from the banner, so marks made
     before the token was set are repaired rather than lost. */
  function reconcile(interactive) {
    var keys = unsynced();
    if (!keys.length) { markStale(); return Promise.resolve(0); }
    if (!writeToken()) {
      if (!interactive) { markStale(); return Promise.resolve(0); }
      askToken();
      if (!writeToken()) { markStale(); return Promise.resolve(0); }
    }
    var done = 0;
    return keys.reduce(function (chain, k) {
      return chain.then(function () {
        var j = jobByKey(k);
        if (!j) return;
        return pushMark(j, false).then(function (ok) { if (ok) done += 1; });
      });
    }, Promise.resolve()).then(function () {
      if (done) toast("Recorded " + done + " previously-local mark" + (done === 1 ? "" : "s") + " in the database.");
      markStale();
      render();
      return done;
    });
  }

  document.addEventListener("click", function (ev) {
    if (ev.target.id === "fixstale") { reconcile(true); return; }
    var sec = ev.target.closest(".sechead");
    if (sec) {
      var id = sec.getAttribute("data-sec");
      collapsed[id] = !collapsed[id];
      try { localStorage.setItem("apply-collapsed", JSON.stringify(collapsed)); } catch (e) {}
      render();
      return;
    }
    /* confirmed submitted */
    var yes = ev.target.closest("button.yes");
    if (yes) {
      var yk = yes.getAttribute("data-yes");
      delete pending[yk]; savePending();
      var yj = jobByKey(yk);
      if (yj) markApplied(yj);
      else render();
      return;
    }
    /* not submitted after all - back in the queue */
    var no = ev.target.closest("button.no");
    if (no) {
      delete pending[no.getAttribute("data-no")];
      savePending(); render();
      toast("Left in the queue.");
      return;
    }

    /* "I applied to this myself." Records it straight away - no confirmation
       step, because the click IS the confirmation. */
    var did = ev.target.closest("button.did");
    if (did) {
      var dk = did.getAttribute("data-did");
      var djob = jobByKey(dk);
      if (!djob) return;
      delete pending[dk]; savePending();
      markApplied(djob);
      return;
    }

    var man = ev.target.closest("button.apply.manual");
    if (man) {
      var mk = man.getAttribute("data-manual");
      var mjob = jobByKey(mk);
      if (!mjob || !mjob.url) return;
      window.open(mjob.url, "_blank", "noopener");
      pending[mk] = Date.now();
      savePending();
      render();
      copy(packet(mjob)).then(function () {
        toast("Opened it for you — details copied. Say whether you submitted when you are back.");
      }).catch(function () {
        toast("Opened it — the clipboard was blocked.");
      });
      return;
    }

    var btn = ev.target.closest("button.apply");
    if (!btn || btn.disabled) return;
    var key = btn.getAttribute("data-k");
    var job = jobByKey(key);
    if (!job || !job.url) return;
    var a = atsOf(job);

    /* Opening a posting is not applying to it. The row goes to "Sent?" and the
       owner confirms; nothing is written to D1 until they do. */
    window.open(job.url, "_blank", "noopener");
    pending[key] = Date.now();
    savePending();
    render();
    copy(packet(job)).then(function () {
      toast(a.cls === "wall"
        ? "Opened " + a.label + " — expect a sign-in or bot check. Details copied."
        : "Opened " + a.label + " — details copied. Confirm on the row when you have submitted.");
    }).catch(function () {
      toast("Opened " + a.label + " — the clipboard was blocked.");
    });
  });

  /**
   * @param {string} key dedupe key
   * @returns {object|null} the job row, or null when nothing matches
   */
  function jobByKey(key) {
    for (var i = 0; i < all.length; i++) { if (keyOf(all[i]) === key) return all[i]; }
    return null;
  }

  document.getElementById("q").addEventListener("input", render);
  document.getElementById("sort").addEventListener("change", function () { sortBy = this.value; render(); });
  document.querySelectorAll(".chip").forEach(function (b) {
    b.addEventListener("click", function () {
      kind = b.getAttribute("data-kind") || "all";
      document.querySelectorAll(".chip").forEach(function (o) {
        o.setAttribute("aria-pressed", o === b ? "true" : "false");
      });
      /* filtering to a section that happens to be collapsed must not look empty */
      if (kind !== "all" && kind !== "direct" && collapsed[kind]) {
        collapsed[kind] = false;
        try { localStorage.setItem("apply-collapsed", JSON.stringify(collapsed)); } catch (e) {}
      }
      render();
    });
  });

  /* ---------- load ---------- */
  /* A cache-busting query on top of no-store. The Function sets no-store and
     _headers repeats it, but a proxy or an extension between Brian and
     Cloudflare can still answer from its own cache, and a stale render shows a
     posting as queued after it has been applied to - which is how a duplicate
     application happens. A unique URL cannot be served from any cache. */
  function loadJobs() {
    return fetch("/api/jobs?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  /* Re-read D1 on a timer and whenever the tab regains focus. The runner is
     submitting while this page is open, so a page loaded twenty minutes ago is
     showing twenty-minute-old truth. */
  setInterval(function () {
    if (document.hidden) return;
    loadJobs().then(function (d) {
      all = Array.isArray(d.jobs) ? d.jobs : all;
      render();
      markStale();
    }).catch(function () { /* keep showing the last good data */ });
  }, 60000);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    loadJobs().then(function (d) {
      all = Array.isArray(d.jobs) ? d.jobs : all;
      render();
      markStale();
    }).catch(function () { /* keep showing the last good data */ });
  });

  loadJobs().then(function (d) {
    all = Array.isArray(d.jobs) ? d.jobs : [];
    document.getElementById("err").hidden = true;
    /* Repair anything marked applied in this browser that never reached D1.
       Silent when there is nothing to do, and never prompts on load. */
    setTimeout(function () { reconcile(false); }, 300);
    markTokenState();
    render();
  }).catch(function (e) {
    var err = document.getElementById("err");
    err.hidden = false;
    err.textContent = "Could not load /api/jobs — showing nothing rather than invented rows. " + e.message;
    all = [];
    document.getElementById("tally").textContent = "0 rows";
    document.getElementById("main").innerHTML = '<div class="empty">Empty — the API is unavailable.</div>';
  });
})();
</script>
</body>
</html>
