<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Brian Ference — Portfolio</title>
<meta name="description" content="AI product manager who puts LLM systems into production, and builds the products too."/>
<link rel="icon" href="/01-light-32.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/shared/site-nav.css"/>
<!-- Absolute, not "./css/...". This page is now served at /portfolio/<handle>
     as well as /portfolio/, and a relative path resolves against the current
     directory: at /portfolio/magnus/ it becomes /portfolio/magnus/css/... and
     404s, so the page renders unstyled with no script. -->
<link rel="stylesheet" href="/portfolio/css/portfolio.css"/>
</head>
<body>
<a class="skip" href="#main">Skip to work</a>
<div id="sitenav"></div>

<main id="main">
  <!-- The hero is the featured project beside the identity: evidence in the
       first screen rather than after four paragraphs of prose. -->
  <section class="hero" aria-labelledby="who">
    <a class="hero-shot" id="hero-shot" href="#"><img id="hero-img" src="" alt="" width="1280" height="800"/></a>
    <div class="hero-copy">
      <p class="kicker">Portfolio</p>
      <h1 id="who">Brian Ference</h1>
      <p class="headline" id="headline"></p>
      <p class="where" id="where"></p>
      <div class="links" id="links"></div>
      <p class="bio" id="bio"></p>
      <p class="kicker" id="featured-kicker">Featured</p>
      <h2 id="featured-name"></h2>
      <p class="blurb" id="featured-blurb"></p>
      <div class="links" id="featured-links"></div>
    </div>
  </section>

  <section class="band" aria-label="More work" id="rows"></section>

  <!-- These sit in the same column as the hero and the project rows. They did
       not: .band has no max-width because each .row supplies its own, so
       anything else dropped into a band ran edge to edge with no left padding. -->
  <section class="band closing" aria-label="Open source">
    <div class="band-inner">
      <h2 class="section-title">Open source</h2>
      <div id="repos"></div>
    </div>
  </section>

  <!-- Resume sections are created in JS only when the API sends them. A
       heading that sits in this file would still appear in the HTML of a
       public page after the section was hidden -- "hidden" on a public page
       has to mean not published, not display:none. -->
  <div id="resume-sections"></div>
</main>

<script type="module" src="/portfolio/js/main.js"></script>
</body>
</html>
