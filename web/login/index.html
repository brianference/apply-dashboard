<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sign in — AI PM Jobs</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="/01-light-32.png" type="image/png" media="(prefers-color-scheme: light)"/>
<link rel="icon" href="/01-dark-32.png" type="image/png" media="(prefers-color-scheme: dark)"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/shared/site-nav.css"/>
<link rel="stylesheet" href="./css/login.css"/>
</head>
<body>

<main class="card">
  <div class="brand">
    <img src="/mark-01.png" alt="" width="88" height="88"/>
    <h1 id="heading">AI PM Jobs</h1>
    <p class="purpose" id="purpose">Sign in to record applications and outcomes.</p>
  </div>

  <div class="alert" id="alert" hidden>
    <svg width="17" height="17" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
      <circle cx="8" cy="8" r="6.75" stroke="currentColor" stroke-width="1.5"/>
      <path d="M8 4.6v4.2M8 11.1v.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <span id="alert-text" role="status"></span>
  </div>

  <form id="form" novalidate>
    <div class="field" id="email-field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required/>
    </div>

    <div class="field" id="password-field">
      <label for="password" id="password-label">Password</label>
      <div class="pw">
        <input id="password" name="password" type="password" autocomplete="current-password" required/>
        <button type="button" class="pw-toggle" id="pw-toggle" aria-controls="password" aria-pressed="false">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
            <path d="M1.3 8S3.7 3.6 8 3.6 14.7 8 14.7 8 12.3 12.4 8 12.4 1.3 8 1.3 8Z" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="8" cy="8" r="2.1" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          <span id="pw-toggle-text">Show</span>
        </button>
      </div>
    </div>

    <button type="submit" class="submit" id="submit">Sign in</button>
  </form>

  <a class="forgot" href="?reset=1" id="secondary">Forgot your password</a>
</main>

<script type="module" src="./js/main.js"></script>
</body>
</html>
