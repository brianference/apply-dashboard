name = "apply-dashboard"
pages_build_output_dir = "."
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "apply-dashboard"
database_id = "10e8a6c0-1fa7-4c33-a007-2044876ce6a7"

# Plain-text bindings live HERE, not only in the dashboard.
#
# `wrangler pages deploy` pushes this file as the project config, and any
# plain_text var that is not in it is dropped from the deployment. Setting
# SITE_ORIGIN through the API and then deploying silently removed it, every
# write started answering "bad origin", and the only reason that was visible
# rather than dangerous is that the Origin check fails CLOSED when SITE_ORIGIN
# is missing. Secrets are not affected: those are stored separately and are not
# expressed here, which is why APPLY_TOKEN, AUTH_PEPPER and BREVO_API_KEY
# survived the same deploy.
[vars]
SITE_ORIGIN = "https://apply-dashboard.pages.dev"
# Sent FROM txeas.com, not from protonmail.com.
#
# protonmail.com publishes v=DMARC1; p=quarantine with strict SPF and DKIM
# alignment (aspf=s, adkim=s), and Brevo is not in its SPF record. Sending as
# that domain through Brevo therefore fails DMARC, and Proton is entitled to
# quarantine or silently discard it - which is exactly what happened: Brevo
# reported "delivered" for two messages that never appeared in the inbox.
#
# txeas.com is authenticated and verified in Brevo, its SPF includes
# spf.brevo.com, and its DMARC is p=none. Verified against live DNS 2026-08-28.
MAIL_FROM = "no-reply@txeas.com"
