name: Daily job run

# Find, filter, dedupe, rank and write, once a day.
#
# THIS REPOSITORY IS PUBLIC, so these run logs are world-readable. The job runs
# ingest/daily.mjs with --quiet, which prints counts only. Job postings are
# public information; which ones Brian applied to, and how each scored against
# his record, are not. Never add an artifact upload here and never echo a row:
# artifacts on a public repo are downloadable by anyone signed in to GitHub.

on:
  schedule:
    # Twice a day. 11:10 UTC is a little after most US boards publish for the
    # morning; 23:10 UTC catches everything posted during the US working day,
    # so a job posted at 9am Pacific is on the list the same evening rather
    # than the next morning.
    - cron: '10 11,23 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Report only, write nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Two runs writing the same table would race on the same dedupe keys.
  group: daily-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the write token is present
        # Fail here rather than let the run report a clean pass that wrote
        # nothing. A silent no-op is the failure mode this whole pipeline
        # exists to avoid.
        env:
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
        run: |
          if [ -z "$CF_D1_TOKEN" ]; then
            echo "CF_D1_TOKEN is not set on this repository. Nothing would be written."
            exit 1
          fi
          echo "token present (${#CF_D1_TOKEN} chars)"

      - name: Supply the resume text
        # resume-text.local.txt is gitignored, so on a CI runner it does not
        # exist -- and resumeMatch silently returned null for every posting,
        # which is why the twice-daily run produced no resume scores at all.
        # The text is a repository secret, written to the path the code reads.
        env:
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
        run: |
          if [ -z "$RESUME_TEXT" ]; then
            echo "RESUME_TEXT is not set: ranking will have no resume component."
            exit 1
          fi
          printf '%s' "$RESUME_TEXT" > apply/resume-text.local.txt
          echo "resume text written ($(wc -c < apply/resume-text.local.txt) bytes)"

      - name: Lint for undefined references
        # This step exists for one bug: a fix used `all`, which index.html
        # declares and ingest/daily.mjs does not, and CI died with
        # ReferenceError at daily.mjs:213 -- on a line whose own test asserted
        # the STRING was present. A text match cannot see an undefined
        # reference. no-undef catches that class in one pass. eslint is
        # installed ad hoc, like playwright, because this repo commits no
        # dependencies.
        run: |
          npm install --no-save --no-audit --no-fund eslint
          npx eslint .

      - name: Run the rule tests
        # One runner, not a list. Every suite here used to be named by hand,
        # and six were added in a single day -- each one a chance to write the
        # test and forget the wiring, which leaves a green tick claiming
        # coverage that never ran. tests/run-all.mjs DISCOVERS test files and
        # fails on any it does not classify, so a new test cannot be silently
        # skipped. Browser suites are excluded here because they need the
        # deployed site; they run after the write, below.
        run: node tests/run-all.mjs --only ingest/,functions/ --no-prod

      - name: Check every test is named in FEATURES.md
        run: node tests/check-coverage.mjs

      - name: Prove the apply queue order
        run: node apply/test-order.mjs

      - name: Repair and attack the database guards
        # A guard that existed once is not a guard: protect_submitted_status
        # vanished between two test runs and an un-submit went through the gap.
        # This re-asserts all of them, restores anything the gap swallowed from
        # the insert-only ledger, and then attacks every un-apply path. It fails
        # the run if any attack succeeds.
        env:
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
        run: node ingest/ensure-guards.mjs

      - name: Repair columns holding the wrong kind of value
        # posted held text on 25 rows ("Posted 2 Days Ago (startDate ...)"),
        # which rendered a broken age, hid the row from the posted-within
        # filter, and read as PRESENT to date-backfill so it was skipped every
        # run. source carried case-variant duplicates, so each board appeared
        # twice in any per-source count. jobs.mjs now stops both at the ingest
        # boundary; this repairs what was already stored. Idempotent, so the
        # steady state is a run that reports nothing to do.
        env:
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
        run: node ingest/repair-fields.mjs ${{ (inputs.dry == true) && '--dry' || '--write' }}

      - name: Collapse postings stored twice
        # decide() stops NEW duplicates; nothing cleaned up the rows that
        # entered before those guards, so seven postings sat in the database
        # twice and one pair reached SUBMITTED twice. Grouped by normalised
        # URL, because "Kin" and "Kin Insurance" are the same employer. A pair
        # where both rows are submitted is reported and left alone. Idempotent.
        env:
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
        run: node ingest/dedupe-repair.mjs ${{ (inputs.dry == true) && '--dry' || '--write' }}

      - name: Find, filter, rank and write
        env:
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
        run: node ingest/daily.mjs --quiet --max-rank 200 ${{ (inputs.dry == true) && '--dry' || '--write' }}

      - name: Fill dates the board still publishes
        # ingest/date-backfill.mjs existed as a CLI and NOTHING ran it, so the
        # refresh audit two steps below reported rows that no step ever fixed --
        # a check with no repair behind it, failing the run on work that was
        # never scheduled. It fills only blanks and never overwrites a posted
        # date with a refresh, because those answer different questions.
        env:
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
        # NOT `&& '' || '--write'`. An empty string is FALSY in a GitHub
        # expression, so `dry && '' || '--write'` yields --write on a DRY
        # run and the step would write to the database exactly when it was
        # told not to. --dry is a non-empty value; date-backfill ignores it
        # and writes only when it sees --write.
        run: node ingest/date-backfill.mjs ${{ (inputs.dry == true) && '--dry' || '--write' }}

      - name: Fail if a published band was left unpriced
        # A posting that publishes a band must never end up on the list with
        # no band. Losing one is worse than showing nothing: the pay lane
        # treats "no band" as unknown, not low, and floats the row above
        # priced postings it should sit below. 19 Greenhouse rows did this
        # and the twice-daily run stayed green, because the only copy of the
        # rule was a comment. Skipped on --dry because a dry run leaves the
        # database unchanged on purpose, and the audit would fail every dry
        # run for the bands it correctly did not write.
        if: ${{ inputs.dry != true }}
        run: node ingest/salary-audit.mjs

      - name: Fail if a dated board row has no employer refresh date
        # Without refreshed_at the stale lens treats every row as "refresh
        # unknown" and keeps it, so the 30-day rule quietly stops hiding
        # anything. 40 of 72 older queued rows could not be judged today
        # for exactly this reason. Skipped on --dry because a dry run
        # leaves the database unchanged on purpose.
        if: ${{ inputs.dry != true }}
        run: node ingest/refresh-audit.mjs

      - name: Drive the deployed page
        # After the write, so it checks the numbers Brian will actually see.
        # The FULL-TIME tile once read 510 over a list of 237 because the rows
        # and the tile came from separate predicates.
        run: |
          # `playwright install` fetches BROWSERS. The package itself still has
          # to be installed or the import fails with ERR_MODULE_NOT_FOUND.
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          node tests/run-all.mjs --site https://apply-dashboard.pages.dev --only tests/
          node apply/test-counts.mjs https://apply-dashboard.pages.dev

      - name: Confirm the database actually moved
        # A wrangler-style "success" is not proof. Read the API back and print
        # counts, so a run that silently wrote nothing is visible as such.
        run: |
          curl -s https://apply-dashboard.pages.dev/api/jobs \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const j=JSON.parse(s).jobs;
                const q=j.filter(x=>x.status==='queued');
                console.log('rows',j.length,'| queued',q.length,
                  '| ranked',q.filter(x=>x.rank_pct!=null).length,
                  '| unranked',q.filter(x=>x.rank_pct==null).length);
              })"
